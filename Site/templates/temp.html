<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur de Points</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            padding: 20px;
        }

        /* Le conteneur de l'image */
        #image-container {
            position: relative;
            width: 424px;
            height: 240px;
            background-color: black;
            border-radius: 4px;
            overflow: hidden; /* Pour que les points ne sortent pas du cadre */
            margin-bottom: 20px;
        }

        /* Le compteur en haut à droite */
        #counter {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-weight: bold;
            z-index: 1; /* Derrière les points (les points auront un z-index par défaut ou plus élevé) */
        }

        /* Style des points verts */
        .point {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #5cb85c;
            border-radius: 50%;
            transform: translate(-50%, -50%); /* Pour centrer le point sur la coordonnée pile */
            z-index: 10; /* Devant le texte */
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 80px;
        }

        button {
            padding: 8px 16px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>

    <div id="image-container">
        <div id="counter">Points : 0</div>
    </div>

    <div class="controls">
        <input type="number" id="posX" placeholder="X (px)">
        <input type="number" id="posY" placeholder="Y (px)">
        <button id="addPoint">Ajouter le point</button>
    </div>

    <script>
        const container = document.getElementById('image-container');
        const btn = document.getElementById('addPoint');
        const counterDisplay = document.getElementById('counter');
        const inputX = document.getElementById('posX');
        const inputY = document.getElementById('posY');

        let pointCount = 0;

        btn.addEventListener('click', () => {
            const x = inputX.value;
            const y = inputY.value;

            if (x !== "" && y !== "") {
                // Création du point
                const point = document.createElement('div');
                point.className = 'point';
                
                // Positionnement
                point.style.left = x + 'px';
                point.style.top = y + 'px';

                // Ajout au conteneur
                container.appendChild(point);

                // Mise à jour du compteur
                pointCount++;
                counterDisplay.innerText = "Points : " + pointCount;

                // Optionnel : vider les inputs après ajout
                inputX.value = "";
                inputY.value = "";
                inputX.focus();
            } else {
                alert("Veuillez entrer des coordonnées X et Y.");
            }
        });
    </script>
</body>
</html>
