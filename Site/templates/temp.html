<style>
  body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; }

  .mission-form {
    max-width: 400px;
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  h2 {
    color: #2d3436;
    font-size: 1.2rem;
    margin-bottom: 1.5rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .option-group {
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    padding: 10px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .option-group:hover {
    border-color: #3498db;
    background-color: #f0f7ff;
  }

  /* Cache le bouton radio par défaut pour le styliser plus tard ou garder le natif */
  input[type="radio"] {
    margin-right: 15px;
    transform: scale(1.2);
    cursor: pointer;
  }

  label {
    cursor: pointer;
    font-weight: 500;
    color: #444;
    width: 100%;
  }
</style>

<form class="mission-form">
  <h2>Choix de la mission</h2>
  
  <div class="option-group">
    <input type="radio" id="mission1" name="mission" value="mission1">
    <label for="mission1">Mission 1</label>
  </div>

  <div class="option-group">
    <input type="radio" id="mission2" name="mission" value="mission2">
    <label for="mission2">Mission 2</label>
  </div>

  <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

  <div class="option-group">
    <input type="radio" id="premission1" name="mission" value="premission1">
    <label for="premission1">Pré-mission 1</label>
  </div>
  </form>
