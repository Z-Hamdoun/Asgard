<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sélecteur de coordonnées</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map2 { height: 500px; width: 100%; border-radius: 8px; }
        .info { margin-top: 10px; font-family: sans-serif; }
    </style>
</head>
<body>

    <h2>Cliquez sur la carte pour placer un point</h2>
    <div id="map2"></div>
    
    <div class="info">
        <strong>Coordonnées :</strong> 
        <span id="coords">Aucun point sélectionné</span>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialisation de la carte (centrée sur le monde)
        // Initialisation de la carte sur Paris (Latitude: 48.8584, Longitude: 2.2945)
        // Avec un zoom de 16 (très proche)
        const map = L.map('map2').setView([ 48.7097, 2.1671], 16);

        // Ajout du fond de carte
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        // Ajout du fond de carte (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker;

        // Événement au clic
        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);

            // Si un marqueur existe déjà, on le déplace, sinon on le crée
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }

            // Affichage des coordonnées dans l'interface
            document.getElementById('coords').innerText = `Lat: ${lat}, Lng: ${lng}`;
            
            // Log console pour récupération facile
            console.log(`Point placé : ${lat}, ${lng}`);
        });
    </script>
</body>
</html>
