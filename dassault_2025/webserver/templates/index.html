<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Olympe</title>
    <link rel="icon" type="image/x-icon" href="static/images/favicon.ico">
    <!--<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">-->
    <style>
        @font-face {
            font-family: 'Montserrat';
            src: url('/static/fonts/montserrat/Montserrat-Regular.tff') format('tff');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Montserrat';
            src: url('/static/fonts/montserrat/Montserrat-Bold.tff') format('tff');
            font-weight: 700;
            font-style: normal;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            background: #fff;
            padding: 40px;
            text-align: center;
            animation: slideDown 0.8s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .content {
            flex: 1;
            padding: 20px;
            max-width: 900px;
            margin: 30px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-out;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }
        
        header {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        nav ul section {
            display: inline-block;
        }
        nav ul section li {
            display: inline;
            margin: 0 8px;
        }
        nav ul section li a {
            background: #4CAF50;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 20px;
            transition: background 0.3s;
        }
        nav ul section li a:hover {
            background: #45a049;
        }
        .nav-button { 
            background: #4CAF50; 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            transition: transform 0.3s, box-shadow 0.3s; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Projet Olympe</h1>
        
        <nav>
            <ul>
                <section>
                    <li><a href="{{ url_for('localisation') }}" class="nav-button" onclick="showSection('localisation')">Localisation</a></li>
                    <li><a href="{{ url_for('control') }}"      class="nav-button" onclick="showSection('control')">Control</a></li>
                </section>
            </ul>
        </nav>
    </header>

    <div class="content">
        <h2>Bienvenue sur Projet Olympe</h2>
        <p>Innovations technologiques pour sauver des vies.</p>
        <!-- Added logo in content -->
        <img src="{{ url_for('static', filename='images/projetolympe.jpg') }}" alt="Projet Olympe Logo" style="display: block; margin: 20px auto; max-width: 250px;">
    </div>
    <script>
        // Global smooth scroll behavior for a fluid navigation experience
        document.documentElement.style.scrollBehavior = "smooth";
    </script>
</body>
</html>
