<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cible Calibration PnP - 5 Points</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .container {
            /* Format A4 approximatif pour l'écran */
            width: 210mm;
            height: 297mm;
            border: 1px solid #ddd;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
        }
        
        /* LE CARRÉ VIRTUEL (Invisible, sert de guide) */
        .pattern-box {
            width: 200mm; /* 20cm de côté pour le test */
            height: 200mm;
            position: relative;
            /* border: 1px dashed #ccc; Décommenter pour voir le cadre */
        }

        .dot {
            width: 30mm; /* Diamètre des points : 3cm */
            height: 30mm;
            background-color: #FF00FF; /* ROSE MAGENTA (High Contrast) */
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%); /* Centrage précis */
        }

        /* POSITIONS */
        .center { top: 50%; left: 50%; }
        .top-left { top: 0%; left: 0%; }
        .top-right { top: 0%; left: 100%; }
        .bottom-right { top: 100%; left: 100%; }
        .bottom-left { top: 100%; left: 0%; }

        .info {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #555;
            text-align: center;
            width: 100%;
        }

        @media print {
            body { height: auto; }
            .container { border: none; }
            /* Force l'impression des couleurs d'arrière-plan */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Zone du Motif (20cm x 20cm) -->
        <div class="pattern-box">
            <!-- Point Central -->
            <div class="dot center"></div>
            
            <!-- 4 Coins -->
            <div class="dot top-left"></div>
            <div class="dot top-right"></div>
            <div class="dot bottom-right"></div>
            <div class="dot bottom-left"></div>
        </div>

        <div class="info">
            Cible PnP ASGARD - Couleur: Magenta (#FF00FF) - Écart Coins: 20cm (Si imprimé à 100%) - Diamètre Points: 3cm
        </div>
    </div>

</body>
</html>
